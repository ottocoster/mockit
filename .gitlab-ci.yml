stages:
  - build
  - push
  
image: docker:latest
services:
  - docker:dind

before_script:
  - MAJOR=$(sed -n 's/^MAJOR *= *\(.*\)/\1/p' src/version.py)
  - MINOR=$(sed -n 's/^MINOR *= *\(.*\)/\1/p' src/version.py)
  - COMMIT=$(sed -n 's/^COMMIT *= *\(.*\)/\1/p' src/version.py)
  - export IMAGE_VERSION="${MAJOR}.${MINOR}.${COMMIT}"
  - export IMAGE_TAG="latest"
  - if [[ "$CI_COMMIT_REF_NAME" != "main" ]]; then
    export IMAGE_VERSION="${MAJOR}.${MINOR}.${COMMIT}-${CI_COMMIT_REF_NAME}";
    export IMAGE_TAG="latest-${CI_COMMIT_REF_NAME}"; 
    fi
  - export IMAGE_FILE="slurpit-mockit-${IMAGE_VERSION}.tar.gz"
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

build:
  stage: build
  script:
    - docker build -t $CI_REGISTRY_IMAGE:${IMAGE_VERSION} .
    - docker save -o "${IMAGE_FILE}" $CI_REGISTRY_IMAGE:${IMAGE_VERSION}
  artifacts:
    paths:
      - ${IMAGE_FILE}
    name: slurpit-mockit
    expire_in: 6 month

push:
  stage: push
  script:
    - ls -la
    - docker load -i "${IMAGE_FILE}"
    - docker push $CI_REGISTRY_IMAGE:${IMAGE_VERSION}
    - docker tag $CI_REGISTRY_IMAGE:${IMAGE_VERSION} $CI_REGISTRY_IMAGE:${IMAGE_TAG}
    - docker push $CI_REGISTRY_IMAGE:${IMAGE_TAG}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  needs:
    - build