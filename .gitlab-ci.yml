---
stages:
  - build
  - test
  - push

image: docker:latest
services:
  - docker:dind

before_script:
  - MAJOR=$(sed -n 's/^MAJOR *= *\(.*\)/\1/p' src/version.py)
  - MINOR=$(sed -n 's/^MINOR *= *\(.*\)/\1/p' src/version.py)
  - COMMIT=$(sed -n 's/^COMMIT *= *\(.*\)/\1/p' src/version.py)
  - export IMAGE_VERSION="${MAJOR}.${MINOR}.${COMMIT}"
  - export IMAGE_TAG="latest"
  - if [[ "$CI_COMMIT_REF_NAME" != "main" ]]; then
      export IMAGE_VERSION="${MAJOR}.${MINOR}.${COMMIT}-${CI_COMMIT_REF_NAME}";
      export IMAGE_TAG="latest-${CI_COMMIT_REF_NAME}";
    fi
  - export IMAGE_FILE="slurpit-mockit-${IMAGE_VERSION}.tar.gz"
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

# Build stage for multi-architecture images
build:
  stage: build
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_CLI_EXPERIMENTAL: "enabled"
  script:
    - docker run --privileged --rm tonistiigi/binfmt --install all  # Enable QEMU for arm64
    - docker buildx create --use                                # Create and use a buildx builder
    #- docker buildx inspect --bootstrap                         # Inspect the builder and bootstrap it
    - docker buildx build . --platform linux/amd64,linux/arm64 --tag "$CI_REGISTRY_IMAGE:${IMAGE_VERSION}" --output "type=tar,compression=gzip,dest=${IMAGE_FILE}" --output "type=registry,ref=$CI_REGISTRY_IMAGE:${IMAGE_VERSION}"
  artifacts:
    paths:
      - "*.tar.gz"
    name: slurpit-mockit
    expire_in: 6 month

unit_test:
  stage: test
  script:
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set1.yml pull
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set1.yml up -d --build --remove-orphan
    - sleep 60
    - docker exec devices-test_container pytest --color=yes -v --durations 0 -m test_set1 -rP
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set1.yml stop || true
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set2.yml pull
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set2.yml up -d --build --remove-orphan
    - sleep 60
    - docker exec devices-test_container pytest --color=yes -v --durations 0 -m test_set2 -rP
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set2.yml stop || true
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set3.yml pull
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set3.yml up -d --build --remove-orphan
    - sleep 60
    - docker exec devices-test_container pytest --color=yes -v --durations 0 -m test_set3 -rP
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set3.yml stop || true
  after_script:
    - mkdir $CI_PROJECT_DIR/logs 
    - |
      for container_id in $(docker compose ps -qa); do
        container_name=$(docker inspect --format='{{.Config.Image}}' $container_id)
        docker logs $container_name > $CI_PROJECT_DIR/logs/logs_${container_name}.txt 2>&1 || true
      done
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set1.yml down -v || true
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set2.yml down -v || true
    - docker compose -f $CI_PROJECT_DIR/tests/docker-compose_set3.yml down -v || true
    - docker system prune -a --volumes -f || true
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/logs/*
    name: test-results
    expire_in: 1 month
  needs:
    - build

push:
  stage: push
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_CLI_EXPERIMENTAL: "enabled"
  script:
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use
    - docker buildx build --platform linux/amd64,linux/arm64 -t $CI_REGISTRY_IMAGE:${IMAGE_VERSION} --push .
    - docker buildx build --platform linux/amd64,linux/arm64 -t $CI_REGISTRY_IMAGE:${IMAGE_TAG} --push .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  needs:
    - unit_test
