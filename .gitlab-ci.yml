variables:
  SLURPIT_IMAGE: slurpit/mockit

stages:
  - build
  - test
  - push

before_script:
  - MAJOR=$(sed -n 's/^MAJOR *= *\(.*\)/\1/p' src/version.py)
  - MINOR=$(sed -n 's/^MINOR *= *\(.*\)/\1/p' src/version.py)
  - COMMIT=$(sed -n 's/^COMMIT *= *\(.*\)/\1/p' src/version.py)
  - export IMAGE_VERSION="${MAJOR}.${MINOR}.${COMMIT}"
  - export IMAGE_TAG="latest"
  - export LATEST=""
  - if [[ "$CI_COMMIT_REF_NAME" != "main" ]]; then
      export IMAGE_VERSION="${MAJOR}.${MINOR}.${COMMIT}-${CI_COMMIT_REF_NAME}";
      export IMAGE_TAG="latest-${CI_COMMIT_REF_NAME}";
      export LATEST="-${CI_COMMIT_REF_NAME}";
    fi
  - export IMAGE_FILE="slurpit-mockit-${IMAGE_VERSION}.tar.gz"
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  - export TESTER_IMAGE="${CI_REGISTRY_IMAGE}:tester"

# Build stage for multi-architecture images
build:
  image: docker:latest
  services:
    - docker:dind
  stage: build
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_CLI_EXPERIMENTAL: "enabled"
  script:
    - docker build --tag "${CI_REGISTRY_IMAGE}:${IMAGE_VERSION}_rc" --push .


build-tester:
  stage: build
  script:
    - cd tests
    - docker build -t "${TESTER_IMAGE}" .
    - docker push "${TESTER_IMAGE}"
  rules:
    - changes:
        - tests/**/*
      when: on_success
    - when: manual
      allow_failure: true


unit_test:
  image: docker:latest
  services:
    - docker:dind
  stage: test
  variables:
    DOCKER_TLS_CERTDIR: ""
    compose_file: $CI_PROJECT_DIR/tests/docker-compose_ssh_telnet.yml
  script:
    - alias dc="docker compose --profile image -f ${compose_file}"
    - dc pull
    - dc up -d --build --wait --remove-orphans
    - docker exec devices-test_container pytest --color=yes -v --durations 0 -rP $pyci test_ssh_telnet.py
    - dc stop

  after_script:
    - mkdir $CI_PROJECT_DIR/logs
    - |
      for container_id in $(docker compose ps -qa); do
        container_name=$(docker inspect --format='{{.Name}}' $container_id)
        docker logs $container_id > "${CI_PROJECT_DIR}/logs/${container_name}.txt" 2>&1 || true
      done
    - dc down -v || true
    - docker system prune -a --volumes -f || true
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/logs/*
    name: test-results
    expire_in: 1 month
  needs:
    - job: build

push:
  image: docker:latest
  services:
    - docker:dind
  stage: push
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_CLI_EXPERIMENTAL: "enabled"
  script:
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use
    - docker login -u ${DOCKER_USERNAME} -p "${DOCKER_TOKEN}"
    - >-
      docker buildx build
      --platform linux/amd64,linux/arm64
      --tag "${CI_REGISTRY_IMAGE}:${IMAGE_VERSION}"
      --output "type=tar,compression=gzip,dest=${IMAGE_FILE}"
      --output "type=registry,ref=${CI_REGISTRY_IMAGE}:${IMAGE_VERSION}"
      --push
      .
    - docker buildx build --platform linux/amd64,linux/arm64 -t $CI_REGISTRY_IMAGE:${IMAGE_VERSION} -t $CI_REGISTRY_IMAGE:${IMAGE_TAG} -t $SLURPIT_IMAGE:${IMAGE_VERSION} -t $SLURPIT_IMAGE:${IMAGE_TAG} --push .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success
  needs:
    - build
    - unit_test
  artifacts:
    paths:
      - "*.tar.gz"
    name: slurpit-mockit
    expire_in: 6 month
