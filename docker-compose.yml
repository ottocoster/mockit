name: devices
services:
  mockit:
    build: .
    environment:
      DEVICE_TYPE: cisco_ios
      SSH_USERNAME: test
      SSH_PASSWORD: test
      SSH_KEX_ALGORITHMS: diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1,diffie-hellman-group-exchange-sha256,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521
      DEBUG_ENABLED: true
    ports: 
       - "22:22"
       - "23:23"
       - "830:830"
       - "161:161/udp"
    networks:
      devices_network:
        ipv4_address: 172.16.240.45 # change to what you prefer

networks:
  devices_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.240.0/24