name: devices
services:
  mockit:
    build: .
    environment:
      - DEVICE_TYPE=paloalto_panos
      - TELNET_USERNAME=test
      - TELNET_PASSWORD=test
      - TELNET_SERVER_ENABLED=true
      # - NETCONF_USERNAME=test
      # - NETCONF_PASSWORD=test
      # - OPENAI_SUPPORT=true
      # - DEVICE_VERSION=v6
      # - DEVICE_DELAY=1
      # - LOGIN_DELAY=3
      # - LOGIN_RETRY=2
    env_file:
      - .env
    networks:
      - devices-network
    ports:
      - "22:22"
      - "23:23"
      - "161:161/udp"
      - "830:830"

networks:
  devices-network:
    driver: bridge