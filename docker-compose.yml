name: devices
services:
  mockit:
    build: .
    environment:
      DEVICE_TYPE: cisco_ios
      SSH_USERNAME: test
      SSH_PASSWORD: test
      DEBUG_ENABLED: true
    ports: 
       - "22:22"
       - "23:23"
       - "830:830"
       - "161:161/udp"
    networks:
      devices-network:
        ipv4_address: 172.16.240.45 # change to what you prefer

networks:
  devices-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.240.0/24