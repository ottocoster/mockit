name: devices
services:
  cisco_ios:
    image: registry.gitlab.com/slurpit.io/device_imitator:latest
    container_name: cisco_ios
    environment:
      DEVICE_TYPE: cisco_ios
      SSH_USERNAME: test
      SSH_PASSWORD: test
    ports: 
       - "22:22"
       - "161:161/udp"

networks:
  devices-network:
    driver: bridge