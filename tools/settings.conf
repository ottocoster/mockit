# Network Data Generator Configuration
# Use # for comments

# Platform name (leave it as cisco_ios)
platform = cisco_ios

# Data types to generate
# Available types: routes, arp, mac, interfaces, vrfs
data_types = routes, arp, mac, interfaces, vrfs

seperate_config_over_devices = false
devices = device1, device2, device3

# Number of entries to generate for each data type
[counts]
routes = 100000
arp = 100000
mac = 100000
interfaces = 100000

# VRF settings
[vrfs]
# Total number of VRFs to generate
count = 10

# Comma-separated list of VRF name specifications:
#   Exact names (no trailing _) are used as-is:        MGMT, PROD
#   Prefix names (trailing _) fill remaining slots,    CUST_ format=02d weight=3
#   proportionally by weight (default weight=1).
#   format= controls zero-padding of the numeric suffix:
#     format=02d -> CUST_01, CUST_02 ...
#     format=04d -> TENANT_0001, TENANT_0002 ...
#   Any slots still unfilled after prefixes are padded with fallback_format numbers.
vrf_name_format = MGMT, PROD, CUST_ format=02d weight=3, TENANT_ format=04d weight=1

# Fallback numbering format when there aren't enough prefix slots to reach count
fallback_format = 03d

# Routes per VRF: set max to 0 to skip per-VRF route files entirely
min_routes_per_vrf = 50
max_routes_per_vrf = 1000
