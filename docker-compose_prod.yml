name: devices
services:
  cisco_xr:
    image: registry.gitlab.com/slurpit.io/mockit:latest
    container_name: cisco_xr
    environment:
      DEVICE_TYPE: cisco_xr
      SSH_USERNAME: test
      SSH_PASSWORD: test
    ports: 
       - "22:22"
       - "23:23"
       - "161:161/udp"

networks:
  devices_network:
    driver: bridge