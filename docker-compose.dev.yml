name: devices
services:
  ubiquiti_unifiswitch:
    build: .
    container_name: devices-ubiquiti_unifiswitch
    environment:
      - DEVICE_TYPE=ubiquiti_unifiswitch
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
      # - DEVICE_DELAY=1
      # - LOGIN_DELAY=3
      # - LOGIN_RETRY=2
    networks:
      - devices-network
    ports:
      - "22:22"
      - "161:161/udp"

networks:
  devices-network:
    driver: bridge