name: devices
services:
  arista_eos:
    build: .
    environment:
      - DEVICE_TYPE=arista_eos
      # - DEVICE_VERSION=v6
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
      # - DEVICE_DELAY=1
      # - LOGIN_DELAY=3
      # - LOGIN_RETRY=2
    networks:
      - devices-network
    ports:
      - "22:22"
      - "161:161/udp"

networks:
  devices-network:
    driver: bridge