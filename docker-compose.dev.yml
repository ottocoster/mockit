version: "3"
name: devices
services:
  cisco_ios:
    build: .
    container_name: cisco_ios
    environment:  
      DEVICE_TYPE: cisco_ios
      SSH_USERNAME: test
      SSH_PASSWORD: test
    networks:
      - devices-network
    ports: 
      - "2222:22"
      - "161:161/udp"
    volumes:
      - ./configs/cisco_ios:/configs/cisco_ios

networks:
  devices-network:
    driver: bridge