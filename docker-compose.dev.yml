name: devices
services:
  a10:
    build: .
    container_name: devices-a10
    environment:
      # - PYTHONPATH=/app
      - DEVICE_TYPE=a10
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
    networks:
      - devices-network
    # volumes:
    #   - .:/app
    ports: 
      - "22:22"
      - "161:161/udp"

networks:
  devices-network:
    driver: bridge