name: devices
services:
  apresia_aeos:
    build: .
    container_name: devices-apresia_aeos
    environment:  
      - PYTHONPATH=/usr/src/app
      - DEVICE_TYPE=apresia_aeos
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
    networks:
      - devices-network
    volumes:
      - .:/usr/src/app
    ports: 
      - "22:22"
      - "161:161/udp"

networks:
  devices-network:
    driver: bridge