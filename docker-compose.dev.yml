name: devices
services:
  cisco_ios:
    build: .
    environment:
      - DEVICE_TYPE=cisco_ios
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
      - SSH_KEX_ALGORITHMS=ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521
      - SSH_CIPHERS=aes256-ctr,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
      #- SSH_KEX_ALGORITHMS=curve25519-sha256,ecdh-sha2-nistp256,diffie-hellman-group14-sha256
      #- SSH_CIPHERS=aes128-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
      - NETCONF_USERNAME=test
      - NETCONF_PASSWORD=test
      - AUTHKEY_ENABLED=true
      - DEBUG_ENABLED=true
      - ENABLE_MODE=true
      - ENABLE_SECRET=secret
      - SNMP_V2_ENABLED=true
      - SNMP_V3_ENABLED=false
      - SNMP_V3_AUTH_TYPE="md5"
      - SNMP_V3_AUTH_KEY="somekey1123"
      - SNMP_V3_PRIV_TYPE="des"
      - SNMP_V3_PRIV_KEY="somekey1123"
      # - AI_SUPPORT=true
      # - DEVICE_VERSION=v6
      # - DEVICE_DELAY=1
      # - LOGIN_DELAY=3
      # - LOGIN_RETRY=2
      # - AI_SUPPORT=true
      # - AI_APIKEY=""
      # - AI_MODEL=""
      # - AI_URL=""
      # - AI_STORE_RESPONSES=false
    # env_file:
    #   - .env
    volumes:
      - ./auth_keys/:/auth_keys/
    networks:
      devices_network:
        ipv4_address: 172.16.240.45 # change to what ipv4 you prefer
        ipv6_address: fc00::abcd # change to what ipv6 you prefer
    ports:
      - "22:22"
      - "23:23"
      - "161:161/udp"
      - "830:830"

networks:
  devices_network:
    enable_ipv6: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.240.0/24
        - subnet: fc00::/64
