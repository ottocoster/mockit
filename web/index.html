<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock'it in the browser</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: #0d1117; color: #c9d1d9;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid #30363d; background: #161b22;
    }
    header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
    label { display: flex; align-items: center; gap: 6px; color: #8b949e; }
    select, input, button {
      font: inherit; color: inherit; background: #0d1117;
      border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px;
    }
    select { min-width: 240px; }
    button { cursor: pointer; background: #21262d; }
    button:hover:not(:disabled) { background: #30363d; }
    button:disabled, select:disabled { opacity: .5; cursor: default; }
    #status { margin-left: auto; color: #8b949e; font-size: 13px; }
    main { flex: 1; min-height: 0; display: flex; }
    #terminal { flex: 1; min-width: 0; padding: 8px 0 0 8px; }
    #honeypot-panel {
      display: none; flex-direction: column; width: min(40%, 480px);
      border-left: 1px solid #30363d; background: #161b22;
    }
    body.honeypot #honeypot-panel { display: flex; }
    #honeypot-panel .bar {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-bottom: 1px solid #30363d; font-weight: 600; color: #f0883e;
    }
    #honeypot-panel .bar span { margin-right: auto; }
    #honeypot-panel button { font-size: 12px; padding: 2px 8px; }
    #honeypot-log {
      flex: 1; margin: 0; padding: 8px 12px; overflow: auto;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap; word-break: break-all; color: #c9d1d9;
    }
    #honeypot-log:empty::before { content: "Commands typed in honeypot mode are recorded here."; color: #6e7681; }
    input[type=checkbox] { accent-color: #f0883e; }
    footer { padding: 6px 16px; font-size: 12px; color: #6e7681; border-top: 1px solid #30363d; }
    footer code { color: #8b949e; }
  </style>
</head>
<body>
  <header>
    <h1>Mock'it</h1>
    <label>Device
      <select id="device" disabled><option>Loading…</option></select>
    </label>
    <label>Enable secret
      <input id="secret" type="password" placeholder="none" size="10">
    </label>
    <label title="Accept any enable password and record every input, like HONEYPOT_MODE=true">
      <input id="honeypot" type="checkbox"> Honeypot mode
    </label>
    <button id="connect" disabled>Reconnect</button>
    <span id="status">Starting Python (WebAssembly)…</span>
  </header>
  <main>
    <div id="terminal"></div>
    <aside id="honeypot-panel">
      <div class="bar"><span>Honeypot log</span>
        <button id="honeypot-download">Download</button>
        <button id="honeypot-clear">Clear</button>
      </div>
      <pre id="honeypot-log"></pre>
    </aside>
  </main>
  <footer>
    Runs the real Mock'it device handlers in Pyodide. Tab completes, <code>?</code> lists commands,
    <code>exit</code> closes the session. SSH, Telnet, SNMP and NETCONF listeners are not available in a browser.
  </footer>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="pyodide/pyodide.js"></script>
  <script src="app.js"></script>
</body>
</html>
