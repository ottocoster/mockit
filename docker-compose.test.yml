name: devices
services:
  arista_eos:
    image: registry.gitlab.com/slurpit.io/mockit:dev
    container_name: arista_eos
    environment:
      DEVICE_TYPE: arista_eos
      SSH_USERNAME: test
      SSH_PASSWORD: test
#      DEVICE_DELAY: 25
#      LOGIN_DELAY: 60
#      LOGIN_RETRY: 2
    ports: 
       - "22:22"
       - "23:23"
       - "830:830"
       - "161:161/udp"
    networks:
      devices-network:
        ipv4_address: 172.16.240.45 # change to what you prefer

networks:
  devices-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.240.0/24