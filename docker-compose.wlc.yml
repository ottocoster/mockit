name: devices
services:
  cisco_wlc:
    build: .
    environment:
      - DEVICE_TYPE=cisco_wlc
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
      - SNMP_V2_ENABLED=true
#    networks:
#      devices_network:
#        ipv4_address: 172.16.240.47 # change to what ipv4 you prefer
#        ipv6_address: fc00::abcd # change to what ipv6 you prefer
    ports:
      - "22:22"
      - "161:161/udp"

networks:
  devices_network:
    enable_ipv6: true
    driver: bridge
