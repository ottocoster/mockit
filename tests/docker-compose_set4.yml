name: devices
services:  
  test_container:
    build: .
    container_name: devices-test_container
    networks:
      - devices-network
    entrypoint: /bin/sh -c "python --version && tail -f /dev/null"
      
      
  adva_fsp150f2:
    build: ../
    container_name: devices-adva_fsp150f2
    environment:  
      DEVICE_TYPE: adva_fsp150f2
      SSH_PASSWORD: test
    networks:
      - devices-network
  
