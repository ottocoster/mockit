version: "3"
name: devices
services:  
  test_container:
    build: .
    container_name: devices-test_container
    networks:
      - devices-network
    entrypoint: /bin/sh -c "python --version && tail -f /dev/null"
  a10:
    build: ../
    container_name: devices-a10
    environment:  
      DEVICE_TYPE: a10
      SSH_PASSWORD: test
    networks:
      - devices-network
    ports: 
      - "22:22"
      - "161:161/udp"

  accedian:
    build: ../
    container_name: devices-accedian
    environment:  
      DEVICE_TYPE: accedian
      SSH_PASSWORD: test
    networks:
      - devices-network

networks:
  devices-network:
    driver: bridge