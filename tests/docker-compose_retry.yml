name: devices
services:
  a10:
    build: ../
    container_name: devices_a10
    environment:
      - DEVICE_TYPE=a10
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
      - LOGIN_RETRY=3
    networks:
      - mockit_network
    ports:
      - "22:22"
      - "161:161/udp"

networks:
  mockit_network:
    driver: bridge
    name: mockit_network