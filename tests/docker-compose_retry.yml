name: devices
services:
  a10:
    build: ../
    container_name: devices-a10
    environment:
      - DEVICE_TYPE=a10
      - SSH_USERNAME=test
      - SSH_PASSWORD=test
      - LOGIN_RETRY=3
    networks:
      - devices_network
    ports:
      - "22:22"
      - "161:161/udp"

networks:
  devices_network:
    driver: bridge