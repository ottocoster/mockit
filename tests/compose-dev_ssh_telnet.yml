name: devices

services:
  test_container:
    build: .
    container_name: devices-test_container
    networks:
      - devices-network
    entrypoint: /bin/sh -c "python --version && tail -f /dev/null"
    environment:
      MOCKIT_UDP_RELOAD_PORT: 9999
    depends_on:
      mocked-device:
        condition: service_healthy

  mocked-device:
    build: ../
    container_name: mocked-device
    environment:
      DEVICE_TYPE: dell_dnos6_telnet
      SSH_PASSWORD: test
      TELNET_USERNAME: root
      TELNET_PASSWORD: test
      UDP_RELOAD_PORT: 9999
      ENABLE_RELOAD: true
      DEBUG_ENABLED: true
    ports:
      - "8022:22"
      - "9999:9999/udp"
    networks:
      - devices-network
    healthcheck:
      test: [ "CMD", "python", "/src/healthcheck.py", "9999"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 10s

networks:
  devices-network:
    driver: bridge
