name: devices
services:  
  test_container:
    build: .
    container_name: devices_test_container
    tty: true
    stdin_open: true
    networks:
      - mockit_network
    command: /bin/sh -c "python --version && tail -f /dev/null"
      
  dell_dnos9:
    build: ../
    container_name: devices_dell_dnos9
